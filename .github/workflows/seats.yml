name: odyssey-70mm-seats

# Checks REAL seat availability (not just "is the showtime listed") for every
# evening 70mm showtime, and opens an issue when a showtime that previously had
# no centred pair gains one. ~126 requests per sweep, so this runs 2-hourly, not
# every 15 minutes like the showtime watcher.

# NOTE: the schedule is deliberately disabled. tickets.fandango.com returns 403
# to GitHub's datacenter IPs, so a scheduled sweep would fail every 2 hours and
# do nothing but generate noise. Seat checking has to run from a residential
# connection - see README. Manual dispatch is kept for testing.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "check a single date only (YYYY-MM-DD)"
        type: string
      baseline:
        description: "record current seat state without alerting"
        type: boolean
        default: false

concurrency:
  group: odyssey-seats
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  seats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep seat maps
        run: |
          set +e
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="--date ${{ inputs.date }}"; fi
          python3 seat_check.py $ARGS | tee seats.log
          code=${PIPESTATUS[0]}
          echo "exit=$code"
          # 2 = every seat check failed; surface it instead of reporting green.
          if [ "$code" = "2" ]; then exit 2; fi
          exit 0

      - name: Open issue on newly-available centre seats
        if: hashFiles('seat_hits.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(python3 -c "import json;print(len(json.load(open('seat_hits.json'))))")
          if [ "$COUNT" = "0" ]; then echo "no new centre seats"; exit 0; fi
          if [ "${{ inputs.baseline }}" = "true" ]; then echo "baseline run; not alerting"; exit 0; fi
          python3 - <<'PY' > issue.md
          import json, pathlib
          hits = json.loads(pathlib.Path("seat_hits.json").read_text())
          print(f"Centre seats opened up on {len(hits)} showtime(s):\n")
          for h in hits:
              b = h.get("best_centred") or {}
              seats = "+".join(b.get("seats", [])) or "?"
              print(f"- **{h['date']} {h['display']}** — {seats} "
                    f"(row {b.get('row','?')}, {b.get('depth',0):.0%} back), "
                    f"{h['pairs_ideal']} ideal pair(s), {h['available']}/{h['total']} free")
              print(f"  [book]({h['url']})")
          print("\nThese go fast — usually only a handful of pairs.")
          PY
          TITLE=$(python3 -c "
          import json
          h=json.load(open('seat_hits.json')); f=h[0]
          extra=f' +{len(h)-1} more' if len(h)>1 else ''
          print(f\"Odyssey 70mm: CENTRE SEATS open {f['date']} {f['display']}{extra}\")")
          gh issue create --title "$TITLE" --body-file issue.md

      - name: Persist seat state
        run: |
          if git diff --quiet -- seat_state.json; then
            echo "seat state unchanged"; exit 0
          fi
          git config user.name  "odyssey-watch[bot]"
          git config user.email "odyssey-watch@users.noreply.github.com"
          git add seat_state.json
          git commit -m "seats: sweep $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "could not push seat state" >&2; exit 1

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seats-log-${{ github.run_id }}
          path: seats.log
          if-no-files-found: ignore
          retention-days: 7
