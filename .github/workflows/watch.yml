name: odyssey-70mm-watch

on:
  schedule:
    # Cron here is UTC. Frontier scan ~every 15 min; full scan every 2 hours.
    # The frontier scan is deliberately left far more frequent than 2h: it
    # covers the horizon edge, which is where a run extension actually shows up.
    - cron: "7,22,37,52 * * * *"
    - cron: "12 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "scan mode"
        type: choice
        options: [frontier, full]
        default: full
      baseline:
        description: "re-baseline state without alerting"
        type: boolean
        default: false
      test_notify:
        description: "send a test email and exit (no scan)"
        type: boolean
        default: false
      test_issue:
        description: "open a test issue and exit (verifies phone push)"
        type: boolean
        default: false

# Never let a frontier run and a full run fight over state.json.
concurrency:
  group: odyssey-watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # the alert channel: an issue push-notifies the GitHub mobile app

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test issue (verifies the phone-push path)
        if: inputs.test_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --assignee davidrmz1 \
            --title "TEST: Odyssey 70mm alert channel check" \
            --body "$(printf '%s\n' \
              '@davidrmz1' '' \
              'TEST -- not a real showtime alert.' '' \
              'If this reached your phone, the GitHub mobile app is set up correctly and' \
              'real alerts will arrive the same way.' '' \
              'A real alert names the date, the showtime, and links straight to booking.' '' \
              'Close this issue; no action needed.')"

      - name: Scan
        id: scan
        if: ${{ !inputs.test_issue }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_TO_SMS: ${{ secrets.MAIL_TO_SMS }}
        run: |
          set +e
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            python3 odyssey_watch.py --test-notify | tee scan.log
            exit ${PIPESTATUS[0]}
          fi
          MODE=full
          if [ "${{ github.event.schedule }}" = "7,22,37,52 * * * *" ]; then
            MODE=frontier
          fi
          if [ -n "${{ inputs.mode }}" ]; then
            MODE="${{ inputs.mode }}"
          fi
          EXTRA=""
          if [ "${{ inputs.baseline }}" = "true" ]; then
            EXTRA="--baseline"
          fi
          echo "running mode=$MODE $EXTRA"
          python3 odyssey_watch.py --mode "$MODE" --days 60 --notify $EXTRA | tee scan.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = nothing new, 10 = hit (already emailed), 2 = endpoint dead,
          # 3 = found something but email failed
          if [ "$code" = "2" ] || [ "$code" = "3" ]; then
            exit "$code"
          fi
          exit 0

      - name: Open issue on a hit
        if: ${{ !inputs.test_issue && hashFiles('hits.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > issue.md
          import json, pathlib
          hits = json.loads(pathlib.Path("hits.json").read_text() or "[]")
          if hits:
              # The @mention and the assignee are what make the GitHub mobile app
              # actually push: it has no "issue in a watched repo" push category.
              print("@davidrmz1\n")
              print(f"{len(hits)} new IMAX 70mm evening showtime(s) at Regal Irvine Spectrum.\n")
              for h in hits:
                  print(f"- **{h['date']} {h['display']}** — [book]({h['url']})")
              print("\nSeats are not checked here; this only means the showtime is newly listed.")
          PY
          if [ ! -s issue.md ]; then
            echo "no hits; no issue"; exit 0
          fi
          TITLE=$(python3 -c "
          import json,pathlib
          h=json.loads(pathlib.Path('hits.json').read_text())
          first=h[0]
          extra=f' +{len(h)-1} more' if len(h)>1 else ''
          print(f\"Odyssey 70mm: new evening showtime {first['date']} {first['display']}{extra}\")")
          gh issue create --assignee davidrmz1 --title "$TITLE" --body-file issue.md

      - name: Persist state
        if: ${{ !inputs.test_issue }}
        run: |
          if git diff --quiet -- state.json; then
            echo "state unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "odyssey-watch[bot]"
          git config user.email "odyssey-watch@users.noreply.github.com"
          git add state.json
          git commit -m "state: horizon update $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have pushed while we were scanning.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "could not push state after 3 attempts" >&2
          exit 1

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: scan.log
          if-no-files-found: ignore
          retention-days: 7
